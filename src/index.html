<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: file:; img-src 'self' data: blob: file: https:; media-src 'self' data: blob: file: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; connect-src 'self' data: blob:;" />
  <title>MashDavood — مش داوود</title>
  <link rel="stylesheet" href="./styles/app.css" />
  <link rel="stylesheet" href="./styles/markdown.css" />
  <link rel="stylesheet" href="./styles/editor.css" />
</head>
<body>
  <div id="app" class="app">

    <header class="titlebar" id="titlebar">
      <div class="tb-traffic"></div>
      <div class="tabstrip" id="tabstrip"></div>
      <div class="tb-actions">
        <button class="icon-btn" id="btn-sidebar" title="Toggle sidebar (⌘\)" aria-label="Toggle sidebar">
          <svg viewBox="0 0 20 20" width="17" height="17"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="7.8" y1="3.5" x2="7.8" y2="16.5" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <div class="segmented" id="viewmode">
          <button data-mode="editor" title="Editor only (⌘1)">
            <svg viewBox="0 0 20 20" width="15" height="15"><path d="M4 5.5h12M4 9h12M4 12.5h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
          </button>
          <button data-mode="split" title="Split (⌘2)">
            <svg viewBox="0 0 20 20" width="15" height="15"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="10" y1="3.5" x2="10" y2="16.5" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <button data-mode="preview" title="Preview only (⌘3)">
            <svg viewBox="0 0 20 20" width="15" height="15"><path d="M10 4.5c-3.6 0-6.3 2.6-7.5 5.5 1.2 2.9 3.9 5.5 7.5 5.5s6.3-2.6 7.5-5.5C16.3 7.1 13.6 4.5 10 4.5Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
        </div>
        <button class="icon-btn" id="btn-theme" title="Toggle theme (⇧⌘L)" aria-label="Toggle theme">
          <svg viewBox="0 0 20 20" width="17" height="17"><path d="M14.5 12.2A5.6 5.6 0 0 1 7.8 5.5a5.7 5.7 0 1 0 6.7 6.7Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" title="Settings (⌘,)" aria-label="Settings">
          <svg viewBox="0 0 20 20" width="17" height="17"><circle cx="10" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 2.6v2M10 15.4v2M17.4 10h-2M4.6 10h-2M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4M15.2 15.2l-1.4-1.4M6.2 6.2 4.8 4.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main class="body" id="body">
      <aside class="sidebar" id="sidebar">
        <div class="side-head">
          <div class="side-switch">
            <button data-panel="files" class="active">Files</button>
            <button data-panel="outline">Outline</button>
          </div>
          <button class="icon-btn sm" id="btn-open-folder" title="Open folder (⇧⌘O)">
            <svg viewBox="0 0 20 20" width="15" height="15"><path d="M2.8 6.2c0-.9.7-1.6 1.6-1.6h2.7l1.5 1.7h6.5c.9 0 1.6.7 1.6 1.6v6.1c0 .9-.7 1.6-1.6 1.6H4.4c-.9 0-1.6-.7-1.6-1.6V6.2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="side-search" id="side-search-wrap">
          <input type="search" id="side-search" placeholder="Filter…" spellcheck="false" />
        </div>
        <div class="side-body" id="side-files"></div>
        <div class="side-body hidden" id="side-outline"></div>
      </aside>

      <div class="v-resizer" id="sidebar-resizer"></div>

      <section class="panes" id="panes">
        <div class="pane pane-editor" id="pane-editor">
          <div id="editor" class="editor-host"></div>
        </div>
        <div class="v-resizer pane-split" id="pane-resizer"></div>
        <div class="pane pane-preview" id="pane-preview">
          <div class="preview-scroll" id="preview-scroll">
            <article class="markdown-body" id="preview"></article>
          </div>
        </div>
      </section>

      <div class="empty-state" id="empty-state">
        <div class="empty-inner">
          <div class="empty-logo">
            <svg viewBox="0 0 64 64" width="54" height="54"><rect x="6" y="10" width="52" height="44" rx="8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M15 41V23l8 10 8-10v18M39 23v14M39 37l5-5M39 37l-5-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </div>
          <h1>مش داوود <span class="latin-name">MashDavood</span></h1>
          <p>خواندن و ویرایش مارک‌داون، با پشتیبانی کامل راست‌به‌چپ</p>
          <div class="empty-actions">
            <button id="es-open">Open File… <kbd>⌘O</kbd></button>
            <button id="es-folder">Open Folder… <kbd>⇧⌘O</kbd></button>
            <button id="es-new">New File <kbd>⌘N</kbd></button>
          </div>
          <div class="empty-recent" id="empty-recent"></div>
        </div>
      </div>
    </main>

    <footer class="statusbar" id="statusbar">
      <div class="st-left">
        <span id="st-path" class="st-path"></span>
      </div>
      <div class="st-right">
        <button class="st-btn" id="st-dir" title="Text direction (⇧⌘A / ⇧⌘R / ⇧⌘D)">dir: auto</button>
        <span id="st-stats"></span>
        <span id="st-cursor"></span>
        <span id="st-saved" class="st-saved"></span>
      </div>
    </footer>

    <div class="modal-backdrop hidden" id="modal-backdrop">
      <div class="modal" id="modal"></div>
    </div>

    <div class="toast-wrap" id="toasts"></div>
  </div>

  <script type="module" src="./renderer/app.js"></script>
</body>
</html>
