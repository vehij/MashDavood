name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # Actions → Build & Release → Run workflow. Without "publish" it is a test build
  # (artifacts only). With "publish" on main it tags v<package.json version> and
  # publishes that release in this same run (a tag pushed with GITHUB_TOKEN does not
  # start another workflow, so nothing builds twice).
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release for the version in package.json (main only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Create the release first: if both build jobs race to create it, GitHub ends up
  # with two releases on the same tag and the assets get split between them.
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (inputs.publish && github.ref == 'refs/heads/main')
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag from $GITHUB_SHA"
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # a manual publish must never re-use a version that is already out
            if [[ "$GITHUB_REF" != refs/tags/* ]]; then
              echo "::error::$TAG is already released — bump the version in package.json"
              exit 1
            fi
            exit 0
          fi
          node scripts/release-notes.mjs "$TAG" > /tmp/notes.md
          # --target creates the tag on this commit when it does not exist yet
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MashDavood ${TAG#v}" \
            --notes-file /tmp/notes.md

  build:
    name: ${{ matrix.name }}
    needs: [release]
    if: always() && !failure() && !cancelled()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64 + x64)
            os: macos-14
            args: --mac
          - name: Windows (x64 + arm64)
            os: windows-latest
            args: --win

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} ${{ needs.release.outputs.tag && '--publish always' || '--publish never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Ad-hoc signed (identity "-"): no Apple certificate, but a valid signature, so a
      # quarantined download gets "unidentified developer" + Open Anyway in Privacy &
      # Security instead of the dead-end "is damaged" an unsigned arm64 app gets.
      # A broken signature fails here rather than on a user's Mac.
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(release/mac*/*.app)
          [ ${#apps[@]} -gt 0 ] || { echo "no .app found under release/mac*"; exit 1; }
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Signature|CodeDirectory|TeamIdentifier)'
          done

      # Unsigned binaries get flagged by SmartScreen and Chrome; checksums at least
      # let a cautious user confirm the file they got is the file CI built.
      - name: Publish checksums
        if: needs.release.outputs.tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          out="SHA256SUMS-${{ runner.os }}.txt"
          node scripts/checksums.mjs release "$out"
          gh release upload "$TAG" "release/$out" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload artifacts (also available without a release)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-installers
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: ignore

  # The notes link directly at the uploaded files, so they can only be verified
  # once both builds have finished.
  finalize:
    name: Verify download links
    needs: [release, build]
    runs-on: ubuntu-latest
    if: needs.release.outputs.tag
    steps:
      - uses: actions/checkout@v4
      - name: Check every linked asset exists, then refresh the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          node scripts/release-notes.mjs "$TAG" --check > /tmp/notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md
