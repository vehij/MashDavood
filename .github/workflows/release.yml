name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the release first: if both build jobs race to create it, GitHub ends up
  # with two releases on the same tag and the assets get split between them.
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "MashDavood ${TAG#v}" \
            --notes-file .github/RELEASE_NOTES.md

  build:
    name: ${{ matrix.name }}
    needs: [release]
    if: always() && !failure() && !cancelled()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64 + x64)
            os: macos-14
            args: --mac
          - name: Windows (x64 + arm64)
            os: windows-latest
            args: --win

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} ${{ startsWith(github.ref, 'refs/tags/') && '--publish always' || '--publish never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Unsigned binaries get flagged by SmartScreen and Chrome; checksums at least
      # let a cautious user confirm the file they got is the file CI built.
      - name: Publish checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          out="SHA256SUMS-${{ runner.os }}.txt"
          shasum -a 256 *.dmg *.exe *.zip *.AppImage 2>/dev/null | grep -v 'SHA256SUMS' > "$out" || true
          cat "$out"
          gh release upload "$TAG" "$out" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload artifacts (also available without a release)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-installers
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: ignore
